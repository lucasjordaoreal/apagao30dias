name: Publicar APAGÃO no GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
        env:
          APAGAO_PUBLIC_URL: ${{ vars.APAGAO_PUBLIC_URL }}
      - run: npm run build
        env:
          APAGAO_PUBLIC_URL: ${{ vars.APAGAO_PUBLIC_URL }}
      - uses: actions/configure-pages@v5
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
