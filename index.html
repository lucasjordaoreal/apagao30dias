<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#192c2c">
  <meta name="description" content="Trinta segundos para se preparar. Trinta dias para sobreviver. Um jogo brasileiro de sobrevivência em pixel art.">
  <title>APAGÃO — 30 DIAS</title>
  <link rel="icon" href="./public/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./public/manifest.webmanifest">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <main id="game">
    <canvas id="world" aria-label="Santa Aurora, mundo do jogo" tabindex="0"></canvas>
    <header id="hud" hidden></header>
    <div id="countdown" hidden></div>
    <aside id="objectives" hidden></aside>
    <div id="notifications" aria-live="polite"></div>
    <div id="context" hidden></div>
    <footer id="toolbar" hidden></footer>
    <div id="touch" hidden><div class="dpad"><button data-key="w" aria-label="Norte">↑</button><button data-key="a" aria-label="Oeste">←</button><button data-key="s" aria-label="Sul">↓</button><button data-key="d" aria-label="Leste">→</button></div><button id="touch-action">E</button></div>
    <div id="overlay"></div>
    <input id="import-file" type="file" accept="application/json,.json" hidden>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
