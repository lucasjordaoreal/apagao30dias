  <link rel="manifest" href="./public/manifest.webmanifest">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <main id="game">
    <canvas id="world" aria-label="Santa Aurora, mundo do jogo" tabindex="0"></canvas>
    <header id="hud" hidden></header>
    <div id="countdown" hidden></div>
    <aside id="objectives" hidden></aside>
    <div id="notifications" aria-live="polite"></div>
    <div id="context" hidden></div>
    <footer id="toolbar" hidden></footer>
    <div id="touch" hidden>
      <div id="joystick" role="group" aria-label="Joystick de movimento">
        <span class="joystick-ring"></span>
        <span id="joystick-knob"></span>
      </div>
      <div class="touch-actions">
        <button id="touch-interact" type="button" aria-label="Interagir com o alvo próximo"><strong>E</strong><span>Interagir</span></button>
        <button id="touch-attack" type="button" data-act="attack" aria-label="Atacar o morador próximo" hidden>⚔<span>Atacar</span></button>
        <button id="touch-run" type="button" aria-label="Correr enquanto pressionado" aria-pressed="false">⇧</button>
        <button id="touch-inventory" type="button" data-act="inventory" aria-label="Abrir mochila">▣</button>
      </div>
    </div>
    <div id="overlay"></div>
    <input id="import-file" type="file" accept="application/json,.json" hidden>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
